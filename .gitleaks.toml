# gitleaks config used by CI (.github/workflows/ci.yml) and by .githooks/pre-push.
# The defaults miss the keys this project handles, so they are added here (NFR-S9, GIT18).
title = "checkbook"

[extend]
useDefault = true

[[rules]]
id = "proxyapi-key"
description = "ProxyAPI / OpenAI-style key (sk-...)"
regex = '''sk-[A-Za-z0-9_-]{32,}'''
keywords = ["sk-"]
