name: deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false # never cut a deploy in half

# Repo Settings -> Pages -> Source: "GitHub Actions". Actions pinned by SHA (NFR-S7), tag in the comment.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app
        run: if [ -f package-lock.json ]; then echo "present=true" >>"$GITHUB_OUTPUT"; else echo "::notice::no app at the repo root yet, nothing to deploy"; fi
      - if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.app.outputs.present == 'true'
        env:
          VITE_GATEWAY_ORIGIN: ${{ secrets.CHECKBOOK_GATEWAY_ORIGIN }} # repo secret (Settings -> Secrets); empty => no AI buttons
        run: npm ci --ignore-scripts && npm run build
      # SPA fallback: Pages serves 404.html for unknown paths (deep links before the SW is installed).
      - if: steps.app.outputs.present == 'true'
        run: cp dist/index.html dist/404.html
      - if: steps.app.outputs.present == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
    outputs:
      present: ${{ steps.app.outputs.present }}

  deploy:
    needs: build
    if: needs.build.outputs.present == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
